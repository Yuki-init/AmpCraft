[package]
name = "amp-platform"
description = "Platform traits and the X11 backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
amp-dock = { version = "0.1.0", path = "../dock" }
log = "0.4.34"
thiserror = "2.0.21"
x11rb = { version = "0.14.0", features = ["shape", "randr", "xtest", "cursor"] }

[dev-dependencies]
amp-ui = { path = "../ui" }
x11rb = { version = "0.14.0", features = ["xtest", "shape"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation"] }
