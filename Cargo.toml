[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yuki-init/AmpCraft"

[workspace.dependencies]
# internal
ampcraft-core = { path = "crates/core" }
ampcraft-audio-out = { path = "crates/audio-out" }
ampcraft-dock = { path = "crates/dock" }
ampcraft-dsp = { path = "crates/dsp" }
ampcraft-library = { path = "crates/library" }
ampcraft-platform = { path = "crates/platform" }
ampcraft-skin = { path = "crates/skin" }
ampcraft-ui = { path = "crates/ui" }
ampcraft = { path = "apps/ampcraft" }

[workspace.lints.rust]
# Never crash, no unsafe: the Crafting Apps standard. The Win32 modules opt out explicitly
# until the egui port removes them (docs/gaps.md).
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Library code must not panic on errors. Tests are exempted in clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
# Light optimization keeps debug builds responsive (pixel loops are 5-10x faster) while
# compiling quickly and keeping debug info.
opt-level = 1

[profile.dev.package."*"]
# Dependencies (FFmpeg bindings, image decoding) are slow unoptimized.
opt-level = 2
