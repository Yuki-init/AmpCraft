[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/Yuki-init/OpenAMP"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Library code must not panic on errors. Tests are exempted in clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
# Light optimization keeps debug builds responsive (pixel loops are 5-10x faster) while
# compiling quickly and keeping debug info.
opt-level = 1

[profile.dev.package."*"]
# Dependencies (FFmpeg bindings, image decoding) are slow unoptimized.
opt-level = 2
