# cargo-deny configuration. Run through scripts/check.sh.

[graph]
all-features = true

[licenses]
# Permissive licenses only. GPL-only crates need owner approval.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    # ffmpeg-next and ffmpeg-sys-next use WTFPL.
    "WTFPL",
]
confidence-threshold = 0.9
# The allow list anticipates future deps; do not warn about unused entries.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are publish = false and carry no license until one is chosen.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
