[package]
name = "ampcraft"
description = "AmpCraft desktop player: configuration and wiring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ampcraft"
path = "src/main.rs"

# Two-window drag, snap and dock demo on the X11 backend.
[[bin]]
name = "ampcraft-dock-demo"
path = "src/bin/dock_demo.rs"

[lints]
workspace = true

[dependencies]
ampcraft-core.workspace = true
ampcraft-audio-out.workspace = true
ampcraft-dock.workspace = true
ampcraft-platform.workspace = true
ampcraft-skin.workspace = true
ampcraft-ui.workspace = true
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4.34"
fontdb = "0.24.0"
ampcraft-dsp.workspace = true
swash = "0.2.10"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
ampcraft-library.workspace = true
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
